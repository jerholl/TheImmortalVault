            font-family: var(--sans);

            justify-content: space-between;
            padding: 24px;

            border: 1px solid var(--border);
            background: var(--dark);
            padding: 40px;
            margin: auto 0;
        }
        .label {
            font-family: var(--mono);
            font-size: 0.55rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--red2);
            margin-bottom: 16px;
        }
        h1 {
            font-family: var(--serif);
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
            margin-bottom: 16px;
        }
        h1 em { color: var(--red2); font-style: italic; }
        p {
            color: var(--muted);
            line-height: 1.9;
            margin-bottom: 22px;
        }
        .item {
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text);
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .back {

            text-decoration: none;
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.58rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            padding: 12px 18px;
        }

        .footer-logo span { color: var(--red); }
        .footer-copy { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
        .footer-social { display: flex; align-items: center; gap: 8px; }
        .social-icon { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--red2); background: rgba(163,21,21,0.2); color: #f3eee8; text-decoration: none; transition: all 0.2s; }

        .footer-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
        .footer-email { font-family: var(--mono); font-size: 0.52rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
        .footer-link { font-family: var(--mono); font-size: 0.52rem; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; text-decoration: none; border-bottom: 1px solid transparent; transition: all 0.2s; }
        .footer-link:hover { color: #fff; border-color: var(--red2); }
        @media (max-width: 900px) {
            footer { flex-direction: column; text-align: center; }
            .footer-right { justify-content: center; }

    <script>
        const item = new URLSearchParams(window.location.search).get("item");
        const backLink = document.getElementById("back-link");
        if (item) {
            document.getElementById("item").textContent = `Item: ${item.replace(/[-_]/g, " ")}`;
            if (item.startsWith("film-project")) {
                backLink.href = "/films";
                backLink.textContent = "← Back to Films";
            } else if (item.startsWith("fiction-work")) {
                backLink.href = "/narrative-fiction";
                backLink.textContent = "← Back to Written Works";
            } else {
