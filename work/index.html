    <style>
        :root {
            --black:#060606; --dark:#0c0c0c; --surface:#111;
            --border:#1c1c1c; --red:#8b0000; --red2:#a31515;
            --text:#d8d4ce; --muted:#4a4a4a;
            --mono:'Share Tech Mono',monospace; --serif:'DM Serif Display',serif; --sans:'Inter',sans-serif;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;}
        body{background:var(--black);color:var(--text);font-family:var(--sans);font-weight:300;line-height:1.6;overflow-x:hidden;}
        body::after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;z-index:9000;}

        nav{position:sticky;top:0;z-index:1000;height:64px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;background:var(--black);border-bottom:1px solid var(--border);}
        .nav-logo{font-family:var(--mono);font-size:0.85rem;letter-spacing:4px;text-transform:uppercase;text-decoration:none;color:var(--text);white-space:nowrap;}
        .nav-logo::after{content:"_";color:var(--red2);animation:blink 1.2s step-end infinite;}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .nav-links{display:flex;gap:28px;list-style:none;}
        .nav-links a{text-decoration:none;color:#e0e0e0;font-family:var(--mono);font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;transition:color 0.2s;white-space:nowrap;}
        .nav-links a::before{content:"/ ";color:var(--red);opacity:0;transition:opacity 0.2s;}
        .nav-links a:hover,.nav-links a.active{color:var(--text);}
        .nav-links a:hover::before,.nav-links a.active::before{opacity:1;}
        .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;flex-shrink:0;}
        .hamburger span{display:block;width:20px;height:1px;background:var(--text);transition:all 0.3s;}
        .hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);background:var(--red2);}
        .hamburger.open span:nth-child(2){opacity:0;}
        .hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);background:var(--red2);}
        .mobile-menu{position:fixed;inset:0;background:var(--black);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
        .mobile-menu.open{max-height:100vh;}
        .mobile-menu a{font-family:var(--mono);font-size:1.1rem;letter-spacing:4px;text-transform:uppercase;text-decoration:none;color:var(--muted);transition:color 0.2s;}
        .mobile-menu a:hover{color:var(--red2);}

        .work-hero{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 60px 100px;}
        .work-eyebrow{font-family:var(--mono);font-size:0.55rem;letter-spacing:4px;text-transform:uppercase;color:var(--red2);margin-bottom:24px;}
        .work-title{font-family:var(--serif);font-size:clamp(2.5rem,8vw,5rem);line-height:1.05;color:var(--text);margin-bottom:20px;letter-spacing:0.02em;}
        .work-title em{font-style:italic;color:var(--red2);}
        .work-genre{font-family:var(--mono);font-size:0.55rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:48px;}
        .work-logline{font-family:var(--serif);font-size:clamp(1.25rem,2.5vw,1.75rem);line-height:1.6;color:var(--text);max-width:680px;margin:0 auto 48px;font-style:italic;}
        .work-back{display:inline-block;text-decoration:none;color:var(--muted);font-family:var(--mono);font-size:0.58rem;letter-spacing:3px;text-transform:uppercase;border:1px solid var(--border);padding:12px 24px;transition:all 0.2s;}
        .work-back:hover{color:var(--red2);border-color:var(--red);}

        footer{padding:28px 60px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);}
        .footer-logo{font-family:var(--mono);font-size:0.7rem;letter-spacing:4px;color:var(--muted);text-transform:uppercase;}
        .footer-logo span{color:var(--red);}
        .footer-copy{font-family:var(--mono);font-size:0.55rem;letter-spacing:2px;color:var(--muted);}
        .footer-social{display:flex;align-items:center;gap:8px;}
        .social-icon{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--red2);background:rgba(163,21,21,0.2);color:#f3eee8;text-decoration:none;transition:all 0.2s;}
        .social-icon svg{width:18px;height:18px;fill:currentColor;}
        .social-icon:hover{color:#fff;border-color:#d32626;background:rgba(163,21,21,0.45);transform:translateY(-1px);}
        .footer-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;}
        .footer-email{font-family:var(--mono);font-size:0.52rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
        .footer-link{font-family:var(--mono);font-size:0.52rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-decoration:none;border-bottom:1px solid transparent;transition:all 0.2s;}
        .footer-link:hover{color:#fff;border-color:var(--red2);}
        @media(max-width:900px){nav{padding:0 24px;} .nav-links{display:none;} .hamburger{display:flex;} .work-hero{padding:60px 24px 80px;} footer{flex-direction:column;gap:10px;text-align:center;padding:28px 24px;} .footer-right{justify-content:center;}}
    </style>
</head>

    <script>
        const WORKS = {
            sedona: { type: 'Screenplay', title: 'SEDONA', genre: 'Action / Horror', logline: 'To find her missing sister, a relentless monster hunter must form an uneasy alliance with a werewolf—the very creature she was trained to kill.' },
            'ghost-train': { type: 'Short Film', title: 'GHOST TRAIN', genre: 'Supernatural Horror', logline: "Two hikers stumble upon a pristine, luxury train sitting on a rusted, dead-end track in the wilderness. Once they step aboard, the doors seal, and they realize the lively gala happening inside is hosted by passengers who haven't been alive for a century." },
            'ghost-hunter': { type: 'Screenplay', title: 'GHOST HUNTER', genre: 'Horror / Comedy (Found Footage)', logline: 'A desperate paranormal streamer tries to save his plummeting views by bringing a cynical skeptic on a live-hunted investigation, only to accidentally unleash a real ancient curse for a global audience.' },
            'alive-again': { type: 'Screenplay', title: 'ALIVE AGAIN', genre: 'Psychological Thriller / Horror', logline: 'A 12-year-old girl begins recovering traumatic memories of a past life, leading her on a chilling quest to prove that a local elderly man is the serial killer who murdered her decades ago.' },
            streamed: { type: 'Screenplay', title: 'STREAMED', genre: 'Slasher / Horror', logline: "When a popular streamer's remote barn-house broadcast is hijacked by a masked killer, the millions of viewers watching online refuse to call for help, convinced the brutal murders are just a sophisticated Halloween prank." },
            'the-memory-box': { type: 'Screenplay', title: 'THE MEMORY BOX', genre: 'Horror / Thriller', logline: 'A disgraced journalist discovers an artifact that allows him to physically experience the memories of the deceased, forcing him to relive a series of cold-case murders to identify a killer who is still on the prowl.' },
            'house-of-mirrors': { type: 'Screenplay', title: 'HOUSE OF MIRRORS', genre: 'Psychological Horror', logline: "As a young man's battle with depression spirals into terrifying hallucinations, his dilapidated family home begins to physically deteriorate alongside his mind—blurring the line between a haunting and a breakdown." },
            rein: { type: 'Screenplay', title: 'REIN', genre: 'Supernatural Drama / Horror', logline: 'Cursed by a 17th-century ritual gone wrong, a father and daughter are bound in a cycle of spiritual immortality. In every reincarnated life, he is driven by a dark providence to murder her to "save" her soul—a grisly pattern they must break before their divinity consumes them both.' },
            malify: { type: 'Screenplay', title: 'MALIFY', genre: 'Horror / Comedy', logline: 'After a 500-year slumber triggered by a bad breakup, an ancient vampire wakes up beneath a bustling modern city and struggles to adapt to the 21st century while living in a chaotic group house with his bloodthirsty old friends.' },
            'spooky-town': { type: 'Novel', title: 'SPOOKY TOWN', genre: 'Middle Grade Horror', logline: "After moving to a foggy new town for her father's work, 13-year-old Maya realizes her dad is missing and the neighbors are acting... beastly. Alongside a group of misfit friends, she uncovers a dark secret: the entire town is under a curse that turned monsters into oblivious humans—and Maya might be the scariest one of them all." }
        };
        const slug = new URLSearchParams(window.location.search).get('item');
        const work = slug && WORKS[slug];
        if (work) {
            document.getElementById('work-eyebrow').textContent = '// ' + work.type;
            document.getElementById('work-title').textContent = work.title;
            document.getElementById('work-genre').textContent = work.genre;
            document.getElementById('work-logline').textContent = work.logline;
            document.title = work.title + ' — The Immortal Vault';
        } else {
            window.location.href = '/narrative-fiction';
        }
        const btn = document.getElementById('hamburger');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => { btn.classList.toggle('open'); menu.classList.toggle('open'); });
        menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { btn.classList.remove('open'); menu.classList.remove('open'); }));
    </script>
